<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swar Netra</title>
  </head>
  <body>
    <!-- View 1: setup (before calibration) -->
    <div id="setup">
      <button id="calibrate" disabled>Calibrate</button>
      <div id="status">Loading…</div>
    </div>

    <!-- View 2: the communication board (after calibration) -->
    <div id="board" hidden>
      <header id="board-top">
        <!-- The last chosen word, shown big so others in the room can read it too -->
        <div id="message">
          <span id="message-icon"></span>
          <span id="message-text">Look at a word to say it</span>
        </div>
        <!-- Controls for the caregiver (used with the mouse, not the eyes) -->
        <div id="caregiver">
          <button id="recalibrate">Recalibrate</button>
          <label><input type="checkbox" id="smooth" checked /> Smoothing</label>
          <label><input type="checkbox" id="show-dot" checked /> Gaze dot</label>
          <details>
            <summary>Accuracy</summary>
            <div id="report"></div>
          </details>
        </div>
      </header>
      <div id="head-warning" hidden></div>
      <main id="words"></main>
    </div>

    <!-- Small camera preview, top-right. The canvas sits exactly on top of the video. -->
    <div id="stage">
      <video id="video" playsinline muted></video>
      <canvas id="overlay"></canvas>
    </div>

    <!-- Full-screen layer where the calibration dots appear -->
    <div id="calib-layer" hidden></div>

    <!-- Shows where the system thinks you're looking -->
    <div id="gaze-dot" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
