<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swar Netra</title>
  </head>
  <body>
    <div id="topbar">
      <button id="calibrate" disabled>Calibrate</button>
      <label><input type="checkbox" id="smooth" checked /> Smoothing</label>
      <div id="status">Loading…</div>
    </div>

    <!-- Accuracy report card, filled in after calibration -->
    <div id="report" hidden></div>

    <!-- Small camera preview in the corner. The canvas sits exactly on top of the video. -->
    <div id="stage">
      <video id="video" playsinline muted></video>
      <canvas id="overlay"></canvas>
    </div>

    <!-- Full-screen layer where the calibration dots appear -->
    <div id="calib-layer" hidden></div>

    <!-- Shows where the system thinks you're looking -->
    <div id="gaze-dot" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
